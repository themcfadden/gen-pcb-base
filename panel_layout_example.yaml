panel:
  max_panel_size_mm: [250.0, 250.0]
  margin: 10.0
  auto_gap_x: 10.0
  auto_gap_y: 10.0
  auto_origin_x: 0.0
  auto_origin_y: 0.0
  base_thickness: 2.8
  wall_height: 12.0
  wall_thickness: 2.4
  standoff_height: 3.0
  standoff_diameter: 6.0
  screw_hole_diameter: 2.8
  label_height: 0.35
  pdf_grid_enabled: true
  pdf_grid_minor_mm: 5.0
  pdf_grid_major_mm: 25.0
  exclude_xy_tolerance: 0.1

boards:
  - name: carrier_left
    kind: step
    label: Carrier Left
    step: ARK_PAB_Carrier_3D_Model.step
    rotation: 0.0
    standoff_height: 3.0
    standoff_diameter: 6.0
    screw_hole_diameter: 2.8
    label_rotation: 0.0

  - name: carrier_right
    kind: step
    label: Carrier Right With A Really Long Name That Should Be Truncated
    step: ARK_PAB_Carrier_3D_Model.step
    rotation: 180.0
    label_rotation: 90.0
    standoff_height: 4.5
    standoff_diameter: 7.0
    screw_hole_diameter: 3.2
    label_enabled: true

  - name: sensor_placeholder
    kind: template
    label: Sensor Placeholder
    rotation: 0.0
    size_mm: [32.0, 18.0]
    standoff_height: 3.0
    standoff_diameter: 6.0
    screw_hole_diameter: 2.8
    standoffs:
      - { xy: [-12.0, -6.0], hole_diameter: 2.8 }
      - { xy: [12.0, -6.0], hole_diameter: 2.8 }
      - { xy: [-12.0, 6.0], hole_diameter: 2.8 }
      - { xy: [12.0, 6.0], hole_diameter: 2.8 }
    wall_cutouts:
      - { side: y+, xy: [0.0, 9.0], width_mm: 8.0, height_mm: 5.0, z_bottom_mm: 1.0 }
